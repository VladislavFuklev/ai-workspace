[project]
name = "ai-workspace-api"
version = "0.0.0"
description = "AI Workspace API — multi-tenant AI document intelligence backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_workspace_api"
