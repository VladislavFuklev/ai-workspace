[project]
name = "ai-workspace-api"
version = "0.0.0"
description = "AI Workspace API — multi-tenant AI document intelligence backend"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary,pool]==3.3.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.14.0",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.0.52",
    "structlog==26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_workspace_api"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Rule sets are enabled deliberately rather than with ALL, so every warning the
# build produces is one somebody chose to care about.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: real errors — undefined names, unused imports
    "I",        # isort: deterministic import order
    "UP",       # pyupgrade: keep syntax current with the pinned interpreter
    "B",        # bugbear: mutable defaults, silent except, loop-variable capture
    "BLE",      # blind `except Exception` — legitimate at a boundary, a bug inside one
    "S",        # bandit: hardcoded secrets, subprocess misuse, weak crypto
    "ASYNC",    # blocking calls inside async def — an event-loop stall
    "A",        # builtin shadowing
    "C4",       # comprehension clarity
    "DTZ",      # naive datetimes; every timestamp here must be tz-aware
    "T20",      # no print(): the project uses structured logging
    "SIM",      # simplifications
    "PTH",      # pathlib over os.path
    "RUF",      # ruff's own checks
]
ignore = [
    "E501",     # line length is the formatter's job, not the linter's
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixtures, and hardcode credentials on purpose.
# RUF001 flags Cyrillic that looks Latin. The product ships in Ukrainian, so
# Ukrainian strings in test data are the point rather than a homoglyph attack.
# The rule stays on everywhere it could hide one.
"tests/**" = ["S101", "S105", "S106", "S311", "RUF001"]
# Alembic generates its own style and shadows builtins in revision templates.
"migrations/**" = ["A", "F401", "I001", "INP001"]
# RUF001 flags characters that look like Latin ones — a homoglyph guard worth
# keeping everywhere else. This file *is* the Cyrillic transliteration table,
# so every one of them is deliberate.
"src/ai_workspace_api/core/slugs.py" = ["RUF001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
# Fail loudly on the two things that silently erode a strict codebase.
warn_unreachable = true
warn_unused_ignores = true
# Third-party packages without type information must be declared, not assumed.
disallow_untyped_defs = true
disallow_any_unimported = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config -W error -m 'not integration'"
# Every async test is a coroutine; marking each one adds nothing.
asyncio_mode = "auto"
markers = [
    "integration: needs the compose stack (scripts/dev-up.sh). Excluded by default.",
]
# Integration tests are opt-in so a machine without the stack still gets a green
# unit run — but scripts/check.sh runs them too, and says so when it cannot.
