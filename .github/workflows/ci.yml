name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two jobs, not one: the dependency graphs are independent (ADR-005), they run
  # in parallel, and a red build names the ecosystem without reading the log.
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      # Job-level, not step-level: `next typegen` loads next.config.ts, which
      # validates the public environment (src/lib/env.ts), so typecheck needs it
      # as much as build does. There is no .env in CI.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Version comes from packageManager in the root package.json.

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        working-directory: .
        # --frozen-lockfile: a stale lockfile must fail here, not resolve quietly.
        run: pnpm install --frozen-lockfile

      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Contrast (WCAG AA)
        working-directory: .
        run: node scripts/check-contrast.mjs
      - name: Message catalogues
        working-directory: .
        run: node scripts/check-messages.mjs
      - name: Reserved slugs
        working-directory: .
        run: node scripts/check-reserved.mjs
      - run: pnpm build

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    services:
      # Integration tests run against a real Postgres with pgvector. SQLite is a
      # different database; a query using pgvector proves nothing there.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        # The readiness check covers Postgres and Redis, so CI needs both or the
        # integration run asserts a degraded service.
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: ai-workspace-ci
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      S3_REGION: us-east-1
      # At least 32 bytes; the setting refuses anything shorter (task 3.5).
      SESSION_SECRET: ci-session-secret-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v7

      # A service container cannot override an image's command, and the MinIO
      # image needs `server /data`, so this one is started by hand. Marked
      # "(CI only)" because scripts/check-ci.sh must not start containers on a
      # developer's machine, where the compose stack already holds port 9000.
      - name: Start MinIO (CI only)
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2
          exit 1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          # Interpreter version comes from apps/api/.python-version.

      - name: Install
        # --locked: fail on a stale lockfile rather than re-resolving.
        run: uv sync --locked

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Migrate
        # Running the migrations here also tests them: a broken revision fails
        # CI rather than a deployment.
        run: uv run alembic upgrade head
      # The bucket is created rather than assumed: the readiness probe checks it
      # exists, so assuming it would make that check untested. "(CI only)" for
      # the same reason as the MinIO step — locally the compose stack made it.
      - name: Create the bucket (CI only)
        run: |
          uv run python - <<'PY'
          import boto3, os
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name=os.environ["S3_REGION"],
          )
          client.create_bucket(Bucket=os.environ["S3_BUCKET"])
          PY
      - run: uv run pytest -m integration
