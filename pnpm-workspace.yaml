packages:
  - "apps/*"
  - "packages/*"

# Dependencies are not allowed to run install scripts unless listed here.
# Added by create-next-app; both are optional native deps Next.js can work without.
allowBuilds:
  sharp: false
  unrs-resolver: false
  # Pulled in by next-intl. Denied, and the build verified without them: a
  # postinstall script is a supply-chain surface (ADR-006), and neither is on
  # the path of anything this project uses.
  '@parcel/watcher': false
  '@swc/core': false

minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/eslint-plugin-next@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - eslint-config-next@16.3.5
  - next@16.3.5
