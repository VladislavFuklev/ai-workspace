# Local development topology for AI Workspace.
#
# Backing services only — the web app and the API run on the host (ADR-007).
# The optional `api` profile builds and runs the API in a container for parity
# checks; it becomes useful once the ASGI app exists (task 2.1).
#
# Host ports default to non-standard values because Homebrew postgresql and redis
# commonly occupy 5432 and 6379. Override any of them in the root .env file.
#
#   scripts/dev-up.sh     start
#   scripts/dev-down.sh   stop

name: ai-workspace

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_workspace_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_workspace}
      # Deterministic initdb settings; the default locale depends on the host.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # pg18 keeps its cluster under /var/lib/postgresql/18/docker, so the volume
      # is mounted one level up. This differs from pg17 and earlier.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ai_workspace} -d ${POSTGRES_DB:-ai_workspace}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only persistence so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    # Pulled from quay.io: the minio/minio repository on Docker Hub now requires
    # authentication, so it cannot be pulled anonymously (see ADR-008).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ai_workspace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ai_workspace_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: create the application bucket, then exit. Idempotent.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 \
          "${MINIO_ROOT_USER:-ai_workspace}" "${MINIO_ROOT_PASSWORD:-ai_workspace_dev_password}"
        mc mb --ignore-existing "local/${S3_BUCKET:-ai-workspace-documents}"
        mc anonymous set none "local/${S3_BUCKET:-ai-workspace-documents}"
        echo "bucket ${S3_BUCKET:-ai-workspace-documents} ready"
    restart: "no"

  # Optional parity check: the API in a container. Not started by default.
  #   docker compose --profile api up --build api
  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The root .env is host-facing (ADR-013): it points at localhost and the
    # published ports. Load it for everything that is the same either way, then
    # override the three addresses that a container must reach differently.
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_workspace}:${POSTGRES_PASSWORD:-ai_workspace_dev_password}@postgres:5432/${POSTGRES_DB:-ai_workspace}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
